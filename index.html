<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Gestão Escolar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
    <div class="container-fluid login-container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5 col-lg-4">
                <div class="login-card card shadow-lg">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <div class="login-logo mx-auto">
                                <i class="bi bi-school-fill"></i>
                            </div>
                            <h2 class="fw-bold mt-2">Gestão Escolar</h2>
                            <p class="text-muted">Faça login para continuar</p>
                        </div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label fw-medium">Email</label>
                                <input type="email" id="email" class="form-control form-control-lg" placeholder="admin@escola.edu.br" required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-medium">Senha</label>
                                <div class="input-group input-group-lg">
                                    <input type="password" id="password" class="form-control" placeholder="Digite sua senha" required>
                                    <span class="input-group-text toggle-password" style="cursor: pointer;">
                                        <i class="bi bi-eye-slash"></i>
                                    </span>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="remember">
                                    <label class="form-check-label" for="remember">Lembrar-me</label>
                                </div>
                                <a href="#" class="text-decoration-none">Esqueceu a senha?</a>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">Entrar</button>
                        </form>

                        <div class="text-center">
                            <p class="mb-0 text-muted">Desenvolvido por <span class="fw-bold">Escola Manager</span></p>
                            <small class="text-muted">v2.0.0</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
